plugins {
  id 'application'
}

group   = 'com.hinolugi'
version = '0.1.0' // Single source of truth - read back at runtime via the jar manifest, see Cli.java

repositories {
  mavenCentral()
}

dependencies {
  testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
  testRuntimeOnly    'org.junit.jupiter:junit-jupiter-engine:6.1.3'
  // Gradle 9 no longer bundles the JUnit Platform launcher - must be declared explicitly.
  testRuntimeOnly    'org.junit.platform:junit-platform-launcher:6.1.3'
}

java {
  // A toolchain (rather than source/targetCompatibility) decouples the JDK used to compile from the JDK
  // running Gradle, and compiles with --release semantics so use of APIs newer than the target is caught at
  // build time. Keep in sync with gradle/gradle-daemon-jvm.properties's toolchainVersion.
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

application {
  mainClass = 'myproject.Cli'
}

test {
  useJUnitPlatform()
}

// Stamps the resolved project version into the jar manifest so Cli.java can read it back at runtime via
// Package.getImplementationVersion() - this is the single source of truth, there is no second hardcoded
// version string to keep in sync (mirrors the Python template's importlib.metadata.version() approach).
// Main-Class makes the plain jar directly runnable via `java -jar` (the 'application' plugin's own mainClass
// setting only wires up the 'run' task and the generated start scripts, not the jar's own manifest).
jar {
  manifest {
    attributes(
      'Main-Class':              application.mainClass.get(),
      'Implementation-Title':    project.name,
      'Implementation-Version':  project.version
    )
  }
}
